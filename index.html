<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS Vita/PSP YouTube Lite</title>
    <style type="text/css">
        body {
            background-color: #000;
            color: #ccc;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        .header {
            background-color: #222;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #f00;
        }
        .search-box {
            margin: 20px 0;
            text-align: center;
        }
        input[type="text"] {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px;
            width: 70%;
        }
        .video-card {
            background: #1a1a1a;
            border: 1px solid #333;
            margin-bottom: 15px;
            padding: 10px;
        }
        .video-title {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .btn {
            background: #f00;
            color: #fff;
            padding: 5px 10px;
            text-decoration: none;
            font-size: 12px;
            display: inline-block;
        }
        .footer {
            font-size: 10px;
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="header">
        <strong>YT LITE PARA PS PORTABLE</strong>
    </div>

    <div class="search-box">
        <form action="https://yewtu.be/search" method="get">
            <input type="text" name="q" placeholder="Buscar video..." />
            <input type="submit" value="Ir" />
        </form>
    </div>

    <div class="video-card">
        <a href="#" class="video-title">Video de Ejemplo (Tendencias)</a>
        <p style="font-size: 11px;">Para reproducir en PS Vita, usa instancias de Invidious que permitan descarga directa o visualización en MP4.</p>
        <a href="https://yewtu.be/feed/popular" class="btn">VER POPULARES</a>
    </div>

    <hr />

    <div class="footer">
        Compatible con NetFront Browser (PSP) y WebKit (PS Vita).<br />
        Sin JavaScript activo.
    </div>

</body>
</html>
